name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo build --release
      - run: cargo test --release
      - run: cargo clippy --all-targets -- -D warnings
      - name: Swift helpers and the full build script
        if: runner.os == 'macOS'
        run: ./build.sh

  # Both runners upload to Coveralls; the 90% floor is checked on macOS, the only runner
  # that reaches the Keychain and SwiftBar code for real.
  coverage:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - run: cargo llvm-cov --release --lcov --output-path lcov.info ${{ runner.os == 'macOS' && '--fail-under-lines 90' || '' }}
      - uses: coverallsapp/github-action@v2
        with:
          file: lcov.info
          flag-name: ${{ matrix.os }}
          parallel: true

  coverage-finish:
    needs: coverage
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: coverallsapp/github-action@v2
        with:
          parallel-finished: true
          carryforward: "ubuntu-latest,macos-latest"
